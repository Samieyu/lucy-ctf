services:
  db:
    image: postgres:16-alpine
    container_name: lucyctf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lucyctf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lucyctf}
      POSTGRES_DB: ${POSTGRES_DB:-lucyctf}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lucyctf}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lucyctf-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lucyctf}:${POSTGRES_PASSWORD:-lucyctf}@db:5432/${POSTGRES_DB:-lucyctf}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      PORT: 4000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lucyctf-frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  db_data:
